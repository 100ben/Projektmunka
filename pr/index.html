<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<style>
:root{
  --bg:#eef2f0; --card:#ffffff; --ink:#14231f; --muted:#5b6b66; --line:#cfd9d5;
  --accent:#1f6f5c; --accent-ink:#ffffff; --panel:#12352d; --panel-ink:#e6f2ee; --error:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1815; --card:#16241f; --ink:#e6f2ee; --muted:#93a8a1; --line:#2a3d37;
    --accent:#4fb59a; --accent-ink:#0b1a16; --panel:#0a2019; --panel-ink:#e6f2ee; --error:#f2b8b5;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1815; --card:#16241f; --ink:#e6f2ee; --muted:#93a8a1; --line:#2a3d37;
  --accent:#4fb59a; --accent-ink:#0b1a16; --panel:#0a2019; --panel-ink:#e6f2ee; --error:#f2b8b5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  display:grid; grid-template-columns:1fr 1fr;
}
.side{
  background:var(--panel); color:var(--panel-ink); padding:56px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.brand{font-size:1.25rem; font-weight:700; letter-spacing:.01em}
.side h2{font-family:Georgia,"Times New Roman",serif; font-weight:400; font-size:2.6rem; line-height:1.15; margin:0; max-width:14ch}
.side p{margin:0; opacity:.75; max-width:32ch}
main{display:flex; align-items:center; justify-content:center; padding:32px}
.card{width:100%; max-width:380px}
h1{font-size:1.75rem; margin:0 0 6px}
.sub{color:var(--muted); margin:0 0 28px}
label{display:block; font-weight:600; font-size:.9rem; margin-bottom:6px}
.field{margin-bottom:18px}
.wrap{position:relative}
input[type=email],input[type=password],input[type=text]{
  width:100%; padding:12px 14px; font:inherit; color:var(--ink);
  background:var(--card); border:1.5px solid var(--line); border-radius:8px;
}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
input[aria-invalid=true]{border-color:var(--error)}
.err{color:var(--error); font-size:.85rem; margin:6px 0 0; min-height:1.2em}
.toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:0; color:var(--accent); font:inherit; font-size:.85rem; font-weight:600;
  padding:6px 8px; cursor:pointer; border-radius:6px;
}
.row{display:flex; justify-content:space-between; align-items:center; font-size:.9rem; margin:4px 0 22px}
.row label{display:flex; gap:8px; align-items:center; font-weight:400; margin:0}
.row input{accent-color:var(--accent); width:16px; height:16px}
a{color:var(--accent); font-weight:600}
.btn{
  width:100%; padding:13px; font:inherit; font-weight:700; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px;
  transition:filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.foot{text-align:center; color:var(--muted); font-size:.9rem; margin-top:22px}
.ok{background:var(--card); border:1.5px solid var(--accent); border-radius:8px; padding:12px 14px; margin-top:16px}
[hidden]{display:none!important}
@media (max-width:760px){
  body{grid-template-columns:1fr}
  .side{padding:28px 24px; gap:20px}
  .side h2{font-size:1.7rem}
  .side p{display:none}
}
</style>
</head>
<body>
<section class="side">
  <div class="brand">Harbor</div>
  <div>
    <h2>Pick up where you left off.</h2>
  </div>
  <p>Your projects, files and teammates are waiting inside.</p>
</section>

<main>
  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Enter your details to open your account.</p>

    <form id="f" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="e1">
        <p class="err" id="e1" role="alert"></p>
      </div>

      <div class="field">
          <label for="pw">Password</label>
          <div class="wrap">
              <input id="pw" type="password" autocomplete="current-password" aria-describedby="e2">
              <button type="button" class="toggle" id="t" aria-controls="pw">Show</button>
            </div>
            <p class="err" id="e2" role="alert"></p>
            <input id="rem" type="checkbox"></button>Futár <input id="rem" type="checkbox"></button>Vevő
      </div>

      <div class="row">
        <label><input type="checkbox" id="rem"> Keep me signed in</label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn" type="submit">Sign in</button>
      <div class="ok" id="ok" hidden role="status">Signed in. This is a demo, so no account was checked.</div>
    </form>

    <p class="foot">New to Harbor? <a href="#">Create an account</a></p>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
